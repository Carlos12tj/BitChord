nombre : APK Debug BitChord
en :
  empujar :
    ramas : [principal]
  flujo_de_trabajo :

empleos :
  compilación-producción-lanzamiento :
    se ejecuta en : ubuntu-latest
    pasos :
      - nombre : Repositorio de Checkout
        usos : actions/checkout@v4
      - nombre : Configurar JDK 17
        usos : actions/setup-java@v4
        con :
          versión de java : ' 17 '
          distribución : ' temurin '
          caché : gradle
      - nombre : Compilar APK Debug
        correr : ./gradlew assembleDebug
      - nombre : Subir APK
        usos : actions/upload-artifact@v4
        con :
          nombre : BitChord-Debug-Arreglado
          ruta : app/build/outputs/apk/debug/app-debug.apk
